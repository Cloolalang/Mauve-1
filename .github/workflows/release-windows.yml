# Build PyInstaller onedir on Windows and attach ZIP to GitHub Releases (on version tags).
# Manual runs upload the ZIP as a workflow artifact (no Release).

name: Release Windows bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: PyInstaller (onedir)
        working-directory: backend
        run: python -m PyInstaller --noconfirm modemtestdriver.spec

      - name: Zip bundle
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "5GModemTestDriver-windows-amd64.zip"
          $src = Join-Path $env:GITHUB_WORKSPACE "backend\dist\5GModemTestDriver"
          if (-not (Test-Path $src)) { throw "PyInstaller output missing: $src" }
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path $src -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length, LastWriteTime

      - name: Attach ZIP to GitHub Release (tags only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: 5GModemTestDriver-windows-amd64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact (manual workflow only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: 5GModemTestDriver-windows-amd64
          path: 5GModemTestDriver-windows-amd64.zip
